  <path d="M50 170 L 72 222 L 94 170 Z" fill="#c8975a"/>
  <path d="M72 186 L 72 214" stroke="#1c4a3a" stroke-width="3" stroke-linecap="round"/>
  <circle cx="72" cy="186" r="4" fill="#1c4a3a"/>
  <!-- face -->
  <circle cx="61" cy="112" r="7" fill="#fdfbf7"/>
  <circle cx="83" cy="112" r="7" fill="#fdfbf7"/>
  <circle cx="62" cy="113" r="3.6" fill="#1c1917"/>
  <circle cx="84" cy="113" r="3.6" fill="#1c1917"/>
  <path d="M62 132 q 10 9 20 0" stroke="#fdfbf7" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <circle cx="52" cy="128" r="4" fill="#e8a38a" opacity=".8"/>
  <circle cx="92" cy="128" r="4" fill="#e8a38a" opacity=".8"/>
  <!-- arms -->
  <path d="M98 140 C 112 140, 116 150, 120 158" stroke="#1c4a3a" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M46 140 C 32 146, 30 156, 34 164" stroke="#1c4a3a" stroke-width="7" fill="none" stroke-linecap="round"/>
