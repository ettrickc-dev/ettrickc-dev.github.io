<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" role="img" aria-label="Penn the pen holding a signed page">
  <!-- page -->
  <g transform="rotate(5 132 170)">
    <rect x="98" y="120" width="76" height="96" rx="5" fill="#fff" stroke="#1c4a3a" stroke-width="3"/>
    <path d="M110 140h52M110 152h52M110 164h38" stroke="#c9bfa9" stroke-width="3" stroke-linecap="round"/>
    <path d="M110 196h52" stroke="#1c4a3a" stroke-width="2"/>
    <path d="M112 192 c6 -10, 10 4, 16 -4 s 8 6, 14 -2" stroke="#1c4a3a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>
  <!-- pen body -->
  <rect x="44" y="28" width="56" height="150" rx="26" fill="#1c4a3a"/>
  <!-- cap band -->
  <rect x="44" y="70" width="56" height="10" fill="#c8975a"/>
  <!-- clip -->
  <rect x="92" y="30" width="8" height="52" rx="4" fill="#c8975a"/>
