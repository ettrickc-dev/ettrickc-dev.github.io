<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" role="img" aria-label="Hummi the hummingbird carrying a form">
  <!-- back wing (motion) -->
  <path d="M112 78 C 92 30, 60 14, 34 22 C 58 34, 80 58, 98 86 Z" fill="#7fd3c0" opacity=".55"/>
  <!-- tail -->
  <path d="M70 118 L 28 150 L 44 124 L 18 128 L 66 104 Z" fill="#1f8a5b"/>
  <!-- body -->
  <ellipse cx="108" cy="104" rx="46" ry="30" transform="rotate(-18 108 104)" fill="#1f8a5b"/>
  <!-- belly -->
  <ellipse cx="116" cy="114" rx="30" ry="15" transform="rotate(-18 116 114)" fill="#e9f6ef"/>
  <!-- head -->
  <circle cx="150" cy="74" r="24" fill="#1f8a5b"/>
  <!-- throat gorget -->
  <path d="M136 84 C 144 100, 162 98, 170 84 C 160 90, 146 90, 136 84 Z" fill="#e2574c"/>
  <!-- eye -->
  <circle cx="157" cy="69" r="6.5" fill="#fff"/>
  <circle cx="158.5" cy="69" r="3.6" fill="#14324a"/>
  <circle cx="160" cy="67.6" r="1.2" fill="#fff"/>
  <!-- beak -->
  <path d="M171 72 L 226 62 L 172 79 Z" fill="#14324a"/>
  <!-- front wing -->
  <path d="M104 90 C 96 44, 120 18, 150 12 C 138 34, 132 62, 122 94 Z" fill="#2fae79"/>
  <path d="M112 86 C 110 58, 124 36, 140 26" stroke="#1f8a5b" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- feet holding the form -->
  <path d="M112 128 l -2 14 M124 124 l 0 15" stroke="#14324a" stroke-width="3" stroke-linecap="round"/>
  <!-- the form -->
  <g transform="rotate(-6 118 160)">
    <rect x="88" y="138" width="62" height="50" rx="4" fill="#fff" stroke="#14324a" stroke-width="3"/>
    <path d="M97 152h36M97 162h44M97 172h26" stroke="#9fb3c4" stroke-width="3" stroke-linecap="round"/>
    <circle cx="138" cy="176" r="8" fill="none" stroke="#e2574c" stroke-width="3"/>
    <path d="M134 176l3 3 5-6" stroke="#e2574c" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
